<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Sentiment Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="section">
            <h1>Product Review Analyzer</h1>

            <p>Enter your review below and click "Analyze" to see its sentiment.</p>
            
            <textarea id="reviewInput" class="input" placeholder="Write your review here..."></textarea>
            
            <button class="button button--primary" onclick="analyzeReview()">Analyze</button>
            
            <p id="result"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
